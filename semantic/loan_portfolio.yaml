# Semantic model over the cleaned portfolio mart.
# Grain: one row per active (not written-off) loan per report_date.
# All amounts are already in KZT at the FX rate on report_date.
#
# Ratio metrics (PAR30, PAR90, NPL, coverage, concentration) are NOT averages of
# row values: they are ratios of two sums, e.g. PAR30 = par30_amount / portfolio.
# The ready-made ratios per date live in reporting.v_portfolio_metrics
# (see semantic/portfolio_metrics.yaml).
# Always filter or group by report_date: summing amounts across snapshots is meaningless.

model: loan_portfolio
source: reporting.v_loan_portfolio

dimensions:
  - name: report_date
    column: report_date
    type: date
    label: Дата среза
  - name: loan_id
    column: loan_id
    type: string
    label: Кредит
  - name: borrower_id
    column: borrower_id
    type: string
    label: Заёмщик
  - name: group_id
    column: group_id
    type: string
    label: Группа связанных заёмщиков
  - name: sector
    column: sector
    type: string
    label: Отрасль
  - name: program
    column: program
    type: string
    label: Программа
  - name: currency
    column: currency
    type: string
    label: Валюта кредита
  - name: dpd_bucket
    column: dpd_bucket
    type: string
    label: Корзина просрочки (0 / 1-30 / 31-90 / 90+)
  - name: days_past_due
    column: days_past_due
    type: number
    label: Дней просрочки
  - name: is_restructured
    column: is_restructured
    type: boolean
    label: Реструктуризирован
  - name: is_npl
    column: is_npl
    type: boolean
    label: NPL (90+ или реструктуризация)
  - name: is_top10_group
    column: is_top10_group
    type: boolean
    label: Входит в топ-10 групп
  - name: is_past_maturity
    column: is_past_maturity
    type: boolean
    label: Срок погашения истёк

measures:
  - name: portfolio_kzt
    column: amount_kzt
    type: sum
    format: "#,##0 ₸"
    label: Портфель, ₸
  - name: loans_count
    column: loan_id
    type: count
    format: "#,##0"
    label: Количество кредитов
  - name: par30_kzt
    column: par30_kzt
    type: sum
    format: "#,##0 ₸"
    label: Портфель с просрочкой > 30 дней, ₸
  - name: par90_kzt
    column: par90_kzt
    type: sum
    format: "#,##0 ₸"
    label: Портфель с просрочкой > 90 дней, ₸
  - name: npl_kzt
    column: npl_kzt
    type: sum
    format: "#,##0 ₸"
    label: NPL, ₸
  - name: provisions_kzt
    column: provision_kzt
    type: sum
    format: "#,##0 ₸"
    label: Провизии, ₸
  - name: top10_groups_kzt
    column: top10_group_kzt
    type: sum
    format: "#,##0 ₸"
    label: Портфель топ-10 групп, ₸
  - name: avg_days_past_due
    column: days_past_due
    type: avg
    format: "#,##0.0"
    label: Средняя просрочка, дней
  - name: avg_loan_kzt
    column: amount_kzt
    type: avg
    format: "#,##0 ₸"
    label: Средний остаток кредита, ₸
